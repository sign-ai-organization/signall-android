# Plantilla para sign-ai-backend. En R-07 esto pasa a la raíz del repo como
# `sonar-project.properties`.
#
# Python no necesita binarios: el scanner lo analiza directo. La cobertura se puede
# sumar después con `sonar.python.coverage.reportPaths`.

sonar.projectKey=sign-ai-backend
sonar.projectName=sign-ai-backend
sonar.sourceEncoding=UTF-8

sonar.sources=app
# El repo no tiene carpeta `tests/`: si se agrega, descomentar.
#sonar.tests=tests

sonar.exclusions=\
  **/__pycache__/**, \
  **/build/**, \
  **/deploy/**

#sonar.python.coverage.reportPaths=coverage.xml
