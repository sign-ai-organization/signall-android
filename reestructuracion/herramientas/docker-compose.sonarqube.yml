# SonarQube local para SignAll — servidor + base de datos.
#
# Uso:
#   docker compose -f reestructuracion/herramientas/docker-compose.sonarqube.yml up -d
#   docker compose -f reestructuracion/herramientas/docker-compose.sonarqube.yml logs -f sonarqube
#   docker compose -f reestructuracion/herramientas/docker-compose.sonarqube.yml down
#
# La primera vez tarda uno o dos minutos: SonarQube arranca su Elasticsearch y migra
# la base. Cuando responde "UP" en http://localhost:9000/api/system/status, ya está.
#
# Primer ingreso: admin / admin. SonarQube pide cambiar la clave en el acto.
#
# El puerto se publica SOLO en 127.0.0.1: el servidor no queda expuesto a la red local.
# Las credenciales de Postgres de acá son de un contenedor que no sale de la máquina;
# no son un secreto del proyecto y no van a ningún `.env`.

name: signall-calidad

services:
  db:
    image: postgres:17-alpine
    container_name: signall-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: signall-sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
