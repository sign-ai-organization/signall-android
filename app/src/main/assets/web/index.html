<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SignAI Avatar</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121316; overflow: hidden; }
    #avatar-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; touch-action: none; }
    #status {
      position: absolute;
      left: 8px;
      top: calc(env(safe-area-inset-top, 0px) + 72px);
      color: #8ff;
      font: 12px monospace;
      z-index: 3;
    }
    /* El debug arranca por debajo de la línea de estado ("Avatar listo…")
       para no taparla nunca. */
    #debug {
      position: absolute;
      left: 8px;
      top: calc(env(safe-area-inset-top, 0px) + 94px);
      color: #7f7;
      font: 11px monospace;
      z-index: 2;
      white-space: pre;
      pointer-events: none;
    }
    /* Tema claro: los colores neón del debug/estado quedan ilegibles sobre
       el fondo claro (#F4F4F2); se oscurecen para mantener contraste. */
    html.light #status { color: #0b6b6b; }
    html.light #debug  { color: #0b6b0b; }
  </style>
</head>
<body>

<canvas id="avatar-canvas"></canvas>
<div id="status">Cargando...</div>
<div id="debug"></div>

<!-- Three.js desde CDN (igual que app/static/index.html) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
