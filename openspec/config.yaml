schema: spec-driven

context: |
  ## SignAll — contexto técnico

  **Objetivo**: traducir español hablado a Lengua de Señas Colombiana (LSC) con un avatar
  3D, en una app Android. Esta app es **una pieza** del sistema: los repos hermanos viven
  en `../sign-ai-backend`, `../sign-ai-stt`, `../sign-ai-docs` y `../signai-avatar`.

  **Este archivo se reescribió entero el 2026-10-17.** La versión anterior describía un
  pipeline de landmarks con `sign.json`, que se reemplazó por clips GLB el 2026-10-13, y
  afirmaba que la app era local sin servidor, que es lo contrario del sistema actual. Dos
  cosas que afirmaba **estaban mal**, y se verificaron contra el código: que
  ningún hueso usara puntos, y que existieran las carpetas `../app/`, `../appKotlin/`,
  `../unity/` y el repo `../sign-ai-gloss-engine`. **Ninguno existe.** Antes de usar algo
  de acá como evidencia, contrastalo contra el código.

  ### Stack
  - Shell: Jetpack Compose + WebView (`WebViewAssetLoader`), paquete `com.signall.app`
  - UI: **Lumo UI de Noman R** (Compose, NO el Lumo de Vaadin) + **Phosphor Icons**.
    **Cero imports de `material3`** — no se agrega Material 3 nuevo.
  - Tipografía: **Liberation Sans** incluida en `res/font/`, métricamente compatible con
    Arial, para coincidir con el prototipo.
  - Escena 3D: **Three.js r169** (ES modules, CDN jsDelivr → **requiere INTERNET en
    runtime**, aunque el avatar y los datos sean locales)
  - Toolchain: AGP 8.9.3, Kotlin 2.3.21, compileSdk/target 36, minSdk 26, JVM 17,
    Compose BOM 2024.12.01

  ### Assets: dos GLB completos, uno por avatar
  - **Dos archivos, `models/juan.glb` (30,32 MB) y `models/pauline.glb` (27,85 MB)**: cada
    uno trae el personaje, la cara y las 50 señas como clips (`0000_afirmativo`..`0049_orden`)
    con sus cuatro marcas faciales (`_afirmativo`, `_pregunta`, `_negacion`, `_orden`)
    —**200 clips**—, reproducidos con `THREE.AnimationMixer`. No hay clip base. La escena
    carga solo el avatar elegido en Ajustes. `signs/<SSSS_VVVV_RRRR>.glb` sigue siendo el
    **identificador lógico** que manda el backend; `app.js` lo traduce al clip `<id>` por
    nombre (`embeddedClipsFor`) y no pide nada por red. No hay archivo por seña.
  - Los originales vienen de **Cascadeur** y viven versionados en el repo hermano
    `../signai-avatar/models/` (`Juan.glb` y `Pauline.glb`, rama `dev`, commit `fc6f372`,
    2026-11-04): son la entrada inmutable del empaquetado y no se editan.
    Esa versión reemplazó las caras emocionales por las cuatro marcas gramaticales y mantuvo
    la cadera centrada.
    a aplicar la corrección de cabeza. `../material-3d/Avatares/` conserva la versión
    anterior (2026-10-24).
  - El pipeline vigente es `tools/pack_avatars.py`: verifica skins, articulaciones y
    nombres de clip, hornea la pose de descanso, poda los morph targets que ninguna
    variante anima, compacta el buffer y escribe los dos `.glb`, `models/avatares.json`,
    `manifest.json` y `domain/SignsCatalog.kt`.
  - `tools/split_signs.py` es el **layout viejo** (`models/` + `signs/`). Sigue en el repo
    porque el pipeline le importa `write_catalog`; `assets/web/signs/` se borró el
    2026-10-22 y no se pide en runtime. `tools/pack_signall.py` es el pipeline viejo de un
    solo avatar: no procesa estos dos archivos.
  - **Nunca editar `models/juan.glb`, `models/pauline.glb` ni `SignsCatalog.kt` a mano.**
  - Entre señas hay una **fundición de 100 ms** (`CROSSFADE_MS`): no hay pose congelada ni
    hueco. Entre lo que se mide y lo que se afirma: `specs/avatar/spec.md`.
  - `manifest.json` repite en las 50 entradas `bytes` y `sha256` del **archivo entero**,
    para cruzar el APK contra el catálogo sin abrir los binarios; no hay asset por seña.

  ### Nombres de huesos — CRÍTICO (verificado contra `tools/glb_pose.py` y los GLB)
  **Las exportaciones de Cascadeur SÍ usan puntos.** La versión anterior de este archivo
  decía lo contrario y daba ejemplos como `DEF-upper_armL`: **eso es falso**, y un agente
  que lo creyera renombraría huesos y rompería la animación sin ver ningún error.
  Verificado el 2026-10-17 contra el `avatar.glb` de entonces **y** contra el export original
  de Cascadeur en `../material-3d/GLB Senas/`, y reverificado el 2026-10-24, el 2026-10-26
  y el 2026-10-27
  contra los dos archivos vigentes: **102 articulaciones de skin.**
  - Cadena del brazo: `shoulder.L`, `upper_arm.L`, `forearm.L`, `hand.L` — con punto, sin prefijo
  - Dedos y palma: `thumb.01.L`, `f_index.01.L`, `palm.01.L` … `palm.04.L`
  - Cara: `brow_*`, `eye_blink_open_*`, `eye_squint_*`, `eyeball*`, `jaw*`, `mouth_*` —
    **sí son joints del skin**
  - Raíz del armature: `HG_Branden` en el archivo único (`HG_Branden.001` en el export
    viejo). **No es una articulación de skin y en el archivo vigente no está animada**;
    los 102 joints empiezan en `spine`.

  **No existe ningún hueso `DEF-` en este rig** — cero coincidencias en los dos archivos.
  Cualquier documento que liste `DEF-upper_armL`, `DEF-browTL`, `DEF-lidTL` o
  `DEF-jaw_master` **está equivocado**. Este mismo archivo afirmaba lo contrario hasta el
  2026-10-17, y también lo afirmaban `specs/pipeline/spec.md` y `specs/avatar/spec.md`.

  **La cara se anima por morph targets.** Los nodos de cara existen con nombres al estilo
  ARKit (`brow_dwn_L`, `brow_outer_up_L`, `eye_blink_open_L`, `jaw_open_lt_rt_frwd`,
  `eyeball.lookat.L`) y **son articulaciones de skin** (están entre los 102 joints), pero la
  expresión de los exports del 2026-11-04 vive en los **canales `weights`** de los morph
  targets, no en los huesos. Desde el 2026-11-04 `app.js` elige una de las cuatro variantes
  según el tipo de oración (`FACE_VARIANT_BY_TYPE`) y reproduce su clip; los dos archivos
  conservan los morph targets que alguna variante anima (**59** bloques de target en Juan y
  **58** en Pauline, contados el 2026-11-05). Los huesos de cara se mueven casi nada (rango
  máximo de un componente del cuaternión: 0,0012, medido sobre el archivo anterior). Es el
  punto **A6** de `docs/CONTRASTE-APPvsDOCUMENTOS.md`: el SRS pide marcadores por tipo de
  frase y desde el 2026-11-04 hay implementación con cuatro caras (pregunta sí/no y pregunta
  de contenido comparten `_pregunta`); falta la validación lingüística de LSC.

  ### Constantes reales de la escena (`app/src/main/assets/web/app.js`)
  `CROSSFADE_MS = 100` · `MAX_DPR = 1.75` (tope a propósito) ·
  `AVATAR_SOURCES = { juan: "models/juan.glb", pauline: "models/pauline.glb" }` ·
  `DEFAULT_SIGN_URL = "signs/0000_0000_0000.glb"` ·
  `BG_COLOR = #121316` · `BG_LIGHT = #f4f4f2`

  **No existen**: `smoothAlpha`, `FACE_ALPHA`, `Z_SCALE`, `FACE_REF_BROW`,
  `FACE_BROW_SCALE`, `FACE_JAW_MAX`. Eran del motor procedural de landmarks, eliminado el
  2026-10-13 (cero coincidencias en `app.js`). Si una tarea de avatar necesita ajustar una
  de esas, no hay a qué ajustarla: lo que se mueve está horneado en el clip.

  ### Problemas conocidos del rig
  - La **ceja derecha se ve casi estática**. El síntoma es real, pero se atribuyó a los
    pesos de `DEF-browTL`/`DEF-browTR`, que **no son huesos de este rig**: la causa no se
    pudo verificar contra el archivo. La app no anima la cara, y los clips actuales dejan
    esos huesos casi quietos (rango máximo de un componente del cuaternión: 0,0012 en los
    50 clips, medido el 2026-10-24), así que la asimetría hay que medirla en el export. Se corrige en Blender sobre el
    `.blend` de origen y re-exportando; nunca en `app.js`.

  ### Puente Kotlin ↔ JS
  **La fuente de verdad es `domain/SignAllCommands.kt`, no esta lista.**
  - Kotlin → JS, `window.SignAll.<método>()` **siempre con guard `?.`**:
    `play`, `playFrom`, `setQueue`, `appendQueue`, `stop`, `setSpeed`, `setReduceMotion`,
    `setTheme`, `setDefaultSign`, `setDebug`, `setFreeCamera`, `setGrid`, `setBackground`,
    `setSilenceTimeoutMs`. Todo método nuevo es **aditivo**: borrar o renombrar uno rompe
    en silencio.
  - JS → Kotlin, `window.SignAllBridge.postMessage(...)` vía
    `WebViewCompat.addWebMessageListener` (con feature-guard):
    `onPlaybackDone`, `avatarReady`, `avatarLoaded:<id>`, `avatarFailed:<id>`,
    `signStart:<idx>:<jsMs>`, `signFailed:<idx>`, `progress:<0..100>`.
  - `avatarReady` es lo que **tapa el splash**, no `onPageFinished`: ese dispara mientras
    el GLB de 34,28 MB (Juan) o 29,46 MB (Pauline) todavía baja. `SignAllSplash` tiene un
    timeout de 8 s de reserva.
  - El canvas de Three.js **no publica nada a accesibilidad**: sale en el árbol como
    `android.webkit.WebView` sin hijos. Para su estado, el tag `SignAllWeb` de logcat o el
    modo debug de Ajustes → AVANZADO.

  ### Flujo de runtime (el que importa)
  ```
  micrófono ─PCM16/16 kHz─► WS :8080/ws/translate ─► backend ─► STT
  texto escrito ─{"type":"text"}─► el mismo WS ─► se traduce ─► segment × N ─► done
                                                                        │
                                          MainScreenState.pendingSegments (sortedMap)
                                                                        │
                                              setQueue + play() · appendQueue por oración
                                                                        │
                                                    escena ─► onPlaybackDone
  ```
  - **La app solo habla con el backend.** Nunca con el STT ni con Neon.
  - **Solo se traduce lo que el cliente manda como `text`.** La voz vuelve como
    `transcript` y **no se traduce**.
  - `segment` es una oración, con `index` y `total` reales desde el primero. Ya no existen
    `stream`, `provisional` ni `source_text`; la app representa cada oración apenas llega
    (D-1) y no espera a `total`.
  - **El `final` siempre llega**, incluso vacío: el STT responde a todo `end`.
  - El catálogo es de **Neon**, manejado por el backend. **Las 50 glosas de LSC50 tienen
    animación desde el 2026-10-22**, así que `GLS-10` ("anunciada pero no exportada") no
    alcanza a ninguna. `SignsCatalog.isOwnAssetPath()` se conserva para una glosa futura
    sin clip: si el ajuste *Seña de prueba si falta* está prendido la representa con la
    seña de reserva y, si está apagado, la saltea sin tocar la red.
  - El detalle del contrato está en `docs/SISTEMA.md` y en el skill `contrato-websocket`.

  ### UI / Features (fuente de verdad)
  El catálogo completo de features vive en `openspec/specs/ui/spec.md`, con IDs de
  dominio: `NAV`, `SPL`, `EDG`, `STG`, `CTL`, `HIS`, `CNV`, `SET`, `PER`, `ACC`, `APP`,
  `STA`, `GLS`, `BRG`, `ANI`, `SEM`, `RSP`, `BRD`, `OM`, `OBS`. Derivado del prototipo
  `PrototipoFrontend/` (Next.js, **solo referencia visual**). La app es Compose nativo; el
  WebView es solo el canvas 3D.

  - **Marca: SignALL** (rebranding del 2026-10-16). Centralizada en
    `ui/SignAllBranding.kt`. **El nombre ya no está abierto.**
  - **Tema: oscuro por defecto** (`Settings.darkTheme = true`). El oscuro es **grafito**
    (`#121316` fondo, `#1A1B1F` superficie, `#33363D` borde) y el azul de marca `#1C4CFC`
    vive **solo en la acción principal y los controles**. El ámbar `live`/`onLive`
    (`#F2B84B`) es **lo único** que significa "escuchando ahora", y nunca es la única
    señal. Los valores están en `ui/designsystem/Color.kt`; la referencia de marca es
    `docs/manual-identidad-visual.md`.
  - Los tokens de espaciado, tamaños, formas y motion están en
    `ui/designsystem/foundation/`. Nada de `.dp` sueltos.
  - **Estado de la UI (2026-10-17)**: las 7 fases de `prototipo-ui-vercel` y la Fase 0 de
    `ui-migration-lumo` están **terminadas y verificadas en device**. Esa migración está
    en `openspec/changes/archive/`. Los planes activos, si los hay, viven en
    `openspec/changes/<nombre>/`.

  ### Repos hermanos
  - `../sign-ai-backend` — FastAPI, NLP de glosas, catálogo, caché semántico, Neon. Rama
    `develop`. **Código en inglés y nunca commit sin que lo pida el owner** (ver su
    `CLAUDE.md`).
  - `../sign-ai-stt` — faster-whisper + WebRTC VAD. Rama `develop`.
  - `../sign-ai-docs` — requerimientos, diagramas del SDD, plan de pruebas. Rama `main`.
    Los `.drawio` y el `.md` de requerimientos **los edita el owner**.
  - `../signai-avatar` — producción de las animaciones con Cascadeur. Rama `dev`:
    versiona los GLB finales de Juan y Pauline en `models/`, que es de donde los lee
    `tools/pack_avatars.py`. Su demo Flask de landmarks está congelada desde el
    2026-09-19 y no se le copian scripts. No se commitea ahí sin que lo pida el owner.
  - **No existen**: `../app/`, `../appKotlin/`, `../unity/`, `../sign-ai-gloss-engine`.

  ### Enfoques muertos — no reintroducirlos
  Servidor Flask, Kotlin+Filament nativo, Unity, Flutter, y el motor procedural de
  landmarks. Las herramientas de ese pipeline (`tools/build_signs.py`,
  `tools/patch_webview_glue.py`, `tools/splice_movement.py`) y los CSVs de muestra de
  `data/LANDMARKS/` **se borraron el 2026-10-22**: no hay nada que revivir.

rules:
  proposal:
    - "Incluir sección de impacto en el pipeline de animación o en el contrato, si aplica"
    - "No reintroducir dependencias muertas (Flask, Filament, Unity, Flutter)"
    - "Si el cambio cruza a otro repo, decir **qué falta del otro lado** en la propuesta"
    - "No inventar terminología: una palabra que no esté en
      `../sign-ai-docs/documentos/requerimientos/` es del owner hasta que la avale"
  tasks:
    - "Separar las tareas de código de las de assets/Blender"
    - "Indicar si el cambio requiere **re-empaquetar los GLB** y por lo tanto correr
      `tools/pack_avatars.py` (o `tools/split_signs.py` si se rearma el layout viejo)"
    - "Verificar los nombres de huesos contra `tools/glb_pose.py` — cadena del brazo con
      punto y sin prefijo (`upper_arm.L`), dedos y palma con punto (`thumb.01.L`,
      `palm.01.L`). **No hay huesos `DEF-` en este rig**"
    - "Si toca UI, la tarea incluye **verificar en el device** en los dos modos"
  spec:
    - "Documentar el formato CSV exacto **solo si** se describe captura de landmarks del
      dataset, que ya no alimenta la app"
    - "Indicar la fuente de cada dato: **Cascadeur** para las animaciones, **LSC50** para
      el dataset de origen"
    - "Toda cifra nueva lleva **su origen**: cuántos fixtures, en qué device, en qué build"

operations:
  apply:
    guidance:
      - "Contrastar los nombres de huesos contra `tools/glb_pose.py` y los GLB, **nunca**
        contra los specs viejos: las listas de nombres de este repo se equivocaron en las
        dos direcciones"
      - "Para ver una pose sin instalar en el device: `tools/preview_pose.py`"
      - "Un cambio de asset es: actualizar `../signai-avatar/models/` en la rama `dev`
        (eso lo hace el owner) y correr `tools/pack_avatars.py`. **Nunca editar
        `juan.glb`, `pauline.glb` ni `SignsCatalog.kt` a mano**"
      - "Si se toca el contrato, cargar el skill `contrato-websocket` y decir qué queda
        pendiente del hermano"
      - "Respetar `MAX_DPR = 1.75` y no forzar `DoubleSide` en las mallas: sin eso el
        Redmi Note 9S va a 99 % de jank"
      - "La cara se anima por morph targets: `app.js` elige una de las cuatro variantes
        (`_afirmativo`, `_pregunta`, `_negacion`, `_orden`) según el tipo de oración. No
        hay clip base; no prometer emociones ni una cara neutra (RF-AVT-03)"
  archive:
    guidance:
      - "Actualizar el `context` de este archivo si cambió algo relevante del proyecto"
      - "Una carpeta de `changes/` terminada se mueve a `changes/archive/` con prefijo de
        fecha, y se corrigen antes las casillas que mienten sobre el estado real"
      - "Borrado no, archivado: las carpetas de septiembre de 2026 apuntan a un pipeline
        inexistente, pero **registran que ese trabajo existió**"
      - "Los documentos de la tesis viven en `../sign-ai-docs/latex/` desde el
        2026-11-04; Overleaf quedó retirado. Una corrección de redacción se hace en el
        `.tex` y se comprueba con `make`; una divergencia de contenido (el documento dice
        una cosa y el código hace otra) la decide el owner"
