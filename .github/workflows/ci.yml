name: CI

# Lo mínimo que se puede verificar sin device ni servidores: que compile —y con
# eso ktlint y el lint de Android— que pasen las pruebas unitarias y que no
# entre una credencial nueva.
#
# El análisis de SonarQube **no** corre acá a propósito: el servidor es local,
# en esta máquina, y no está expuesto a internet. Se corre a mano antes de
# cerrar una sesión:
#
#   tools/calidad/sonar.sh signall-android
#
# gitleaks escanea el árbol y **toda la historia**: desde la reescritura del
# 2026-11-14 la historia ya no tiene credenciales, así que el job puede mirarla
# completa y detectar un secreto aunque se haya agregado en un commit viejo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar y ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew build
        run: ./gradlew build --no-daemon

  leaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La historia completa: el escaneo de `git` la necesita.
          fetch-depth: 0

      - name: gitleaks 8.30.1 sobre el árbol y la historia
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --redact --verbose
