<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba de transición — copias</title>
<style>body{margin:0;background:#222;color:#eee;font:18px system-ui}header{padding:14px}main{display:flex}section{width:50%;text-align:center}canvas{width:100%;height:75vh}button{font:inherit;margin-left:16px}small{display:block}</style>
<header>Grupo 07 · <label>Seña <select id="sign"><option value="0028">0028 — pendiente</option><option value="0029">0029 — pendiente</option><option value="0030">0030 — regreso temprano</option><option value="0031">0031 — pendiente</option><option value="0032">0032 — pendiente</option></select></label><button id="avatar">Cambiar a Pauline</button><button id="repeat">Repetir</button><label>Variante <select id="variant"><option value="afirmativo">Afirmativa</option><option value="pregunta">Pregunta</option><option value="negacion">Negación</option><option value="orden">Orden</option></select></label><small>Izquierda: app actual · derecha: propuesta con acomodo final suave. Entradas intactas, incluido el inicio flexionado de 0028. 0030 tiene un regreso más temprano; revisar que conserve su gesto. Sin integración.</small><a href="../group-06/" style="color:#ccc">Volver al grupo aprobado</a></header>
<main><section>Actual<canvas id="before"></canvas></section><section>Propuesta<canvas id="after"></canvas></section></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const loader=new GLTFLoader(), views=[]; let avatar='juan', start=0, ready=false;
for(const id of ['before','after']){
 const canvas=document.getElementById(id),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1);
 const scene=new T.Scene();scene.background=new T.Color('#303238');scene.add(new T.HemisphereLight(0xffffff,0x666666,3));
 const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,4,4);scene.add(light);
 const camera=new T.PerspectiveCamera(35,1,.01,100);views.push({renderer,scene,camera});
}
async function load(){ready=false;await Promise.all(views.map(async(v,i)=>{
 if(v.root){v.scene.remove(v.root);v.mixer.stopAllAction();v.root.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of [o.material].flat()){for(const x of Object.values(m))if(x?.isTexture)x.dispose();m.dispose();}}});}
 const gltf=await loader.loadAsync(`${avatar}-${i?'despues':'antes'}.glb`);v.root=gltf.scene;
 const box=new T.Box3().setFromObject(v.root),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());
 v.scene.add(v.root);v.camera.position.copy(center).add(new T.Vector3(size.y*.25,size.y*.03,size.y*2.1));v.camera.lookAt(center);
 v.mixer=new T.AnimationMixer(v.root);v.clips=gltf.animations;configure(v);
 }));start=performance.now();ready=true;window.previewReady=avatar;}
document.getElementById('avatar').onclick=()=>{avatar=avatar==='juan'?'pauline':'juan';document.getElementById('avatar').textContent=`Cambiar a ${avatar==='juan'?'Pauline':'Juan'}`;load();};
document.getElementById('repeat').onclick=()=>start=performance.now();
function configure(v){v.mixer.stopAllAction();v.clip=v.clips.find(c=>c.name===document.getElementById('sign').value+'_'+document.getElementById('variant').value);v.action=v.mixer.clipAction(v.clip);v.action.setLoop(T.LoopOnce,1);v.action.clampWhenFinished=true;window.previewSelection=v.clip.name;}
for(const id of ['sign','variant'])document.getElementById(id).onchange=()=>{if(!ready)return;for(const v of views)configure(v);start=performance.now();};
// Solo visor: no modifica las muestras de los GLB ni el controlador Android.
// La cola del gesto queda intacta hasta 0,25 s antes de acabar el clip.
function timing(local,duration,smooth){
 if(local<0)return {active:false,time:0,weight:0};
 if(!smooth)return {active:local<duration+.1,time:Math.min(local,duration),weight:Math.min(1,local/.1,Math.max(0,(duration+.1-local)/.1))};
 const tail=.25,span=.7,begin=duration-tail;
 if(local<begin)return {active:true,time:local,weight:Math.min(1,local/.1)};
 const u=Math.max(0,Math.min(1,(local-begin)/span));
 // Hermite: velocidad inicial 1, final 0, sin retroceder en el clip.
 const time=begin+span*u+(3*tail-2*span)*u*u+(span-2*tail)*u*u*u;
 const ease=6*u**5-15*u**4+10*u**3;
 return {active:u<1,time,weight:1-ease};
}
window.previewTiming=timing;
function frame(now){requestAnimationFrame(frame);if(!ready)return;
 const duration=views[0].clip.duration,cycle=duration+2.5,t=window.previewTime??(((now-start)/1000)%cycle);
 for(const [i,v] of views.entries()){v.mixer.stopAllAction();const sample=timing(t-.7,duration,i===1);if(sample.active){v.action.reset().setEffectiveWeight(sample.weight).play();v.mixer.setTime(sample.time);}const w=v.renderer.domElement.clientWidth,h=v.renderer.domElement.clientHeight;v.renderer.setSize(w,h,false);v.camera.aspect=w/h;v.camera.updateProjectionMatrix();v.renderer.render(v.scene,v.camera);}}
load();requestAnimationFrame(frame);
</script></html>
