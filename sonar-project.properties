# Proyecto de SonarQube local para signall-android.
#
#   tools/calidad/sonar.sh signall-android
#
# El análisis de Kotlin necesita los binarios compilados: `sonar.kotlin.binaries`
# apunta a `app/build/tmp/kotlin-classes/debug`, así que hay que compilar antes
# de escanear (`./gradlew build`).

sonar.projectKey=signall-android
sonar.projectName=signall-android
sonar.sourceEncoding=UTF-8

sonar.sources=app/src/main/java
sonar.tests=app/src/test
# La cobertura la genera JaCoCo en `./gradlew test` (ver app/build.gradle.kts).
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml

# Lo que NO se analiza: código generado, assets web (JS del avatar, que se revisa
# aparte y no es código Kotlin) y el material de documentación.
sonar.exclusions=\
  **/build/**, \
  app/src/main/assets/**, \
  docs/**, \
  **/*.glb, **/*.json

# Binarios compilados.
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug
