# Proyecto de SonarQube local para signall-android.
#
#   tools/calidad/sonar.sh signall-android
#
# El análisis de Kotlin necesita los binarios compilados: `sonar.kotlin.binaries`
# apunta a `app/build/tmp/kotlin-classes/debug`, así que hay que compilar antes
# de escanear (`./gradlew build`).

sonar.projectKey=signall-android
sonar.projectName=signall-android
sonar.sourceEncoding=UTF-8

sonar.sources=app/src/main/java
sonar.tests=app/src/test
# La cobertura la genera JaCoCo en `./gradlew jacocoTestReport`.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml
# El design system es el código de Lumo copiado y adaptado, no lógica de la app:
# se mide la cobertura del código propio (decisión del owner, 2026-11-14).
sonar.coverage.exclusions=\
  app/src/main/java/com/signall/app/ui/designsystem/**, \
  app/src/main/java/com/signall/app/ui/icons/**, \
  app/src/main/java/com/signall/app/ui/theme/**

# La regla kotlin:S1135 ("Complete the task associated to this TODO comment")
# matchea la palabra española «todo» de los comentarios, porque el código comenta
# en español. No hay ningún TODO/FIXME real:
#   grep -rnE "\b(TODO|FIXME|XXX|HACK)\b" app/src/main/java   # sin resultados
# Se excluye para que cada análisis no vuelva a abrir los mismos 15 falsos
# positivos (2026-11-14).
sonar.issue.ignore.multicriteria=s1135
sonar.issue.ignore.multicriteria.s1135.ruleKey=kotlin:S1135
sonar.issue.ignore.multicriteria.s1135.resourceKey=**/*.kt

# Lo que NO se analiza: código generado, assets web (JS del avatar, que se revisa
# aparte y no es código Kotlin) y el material de documentación.
sonar.exclusions=\
  **/build/**, \
  app/src/main/assets/**, \
  docs/**, \
  **/*.glb, **/*.json

# Binarios compilados.
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug
