# Plantilla para sign-ai-android. En R-07 esto pasa a la raíz del repo como
# `sonar-project.properties`.
#
# El análisis de Kotlin necesita los binarios compilados. Hay dos caminos:
#   A) el sonar-scanner de `herramientas/escanear/sonar.sh` con `sonar.kotlin.binaries`
#      apuntando a `app/build/tmp/kotlin-classes/debug`
#   B) el plugin Gradle `org.sonarqube`, que resuelve los binarios solo
# Lo correcto para Android es (B); (A) sirve para ver el primer informe rápido.

sonar.projectKey=sign-ai-android
sonar.projectName=sign-ai-android
sonar.sourceEncoding=UTF-8

sonar.sources=app/src/main/java
# El repo no tiene `app/src/test`: hoy no hay ni un test. Si se agregan, descomentar.
#sonar.tests=app/src/test

# Lo que NO se analiza: código generado, assets web (JS del avatar, que se revisa
# aparte y no es código Kotlin) y el material de documentación.
sonar.exclusions=\
  **/build/**, \
  app/src/main/assets/**, \
  docs/**, \
  reestructuracion/**, \
  **/*.glb, **/*.json

# Binarios compilados, solo si se usa el camino (A).
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug
